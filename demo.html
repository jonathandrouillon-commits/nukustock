<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NukuStock Demo</title><style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e5e7eb;--brand:#0b1220;--accent:#2563eb;--good:#0f8a4b;--warn:#b86a00;--danger:#c83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--brand);color:#fff;padding:20px 14px}.brand{font-size:20px;font-weight:800;padding:8px 10px 22px}.brand small{display:block;font-size:11px;color:#98a2b3;font-weight:500;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cfd4dc;text-align:left;padding:12px;border-radius:11px;font-weight:600;cursor:pointer}.nav button.active,.nav button:hover{background:#1d2939;color:white}.main{margin-left:230px}.top{height:66px;background:#fffc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;backdrop-filter:blur(10px)}.page{padding:24px;max-width:1400px;margin:auto}.page h1{margin:0 0 5px;font-size:27px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px}.stat span{font-size:12px;color:var(--muted)}.stat strong{font-size:25px;display:block;margin-top:7px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.btn{border:0;border-radius:11px;background:var(--brand);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.input,select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;min-height:40px}.input{min-width:240px}.table{overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#fafafa}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2f6;font-size:10px;font-weight:800}.good{background:#e8f7ef;color:var(--good)}.warn{background:#fff2dc;color:var(--warn)}.danger{background:#ffeded;color:var(--danger)}.info{background:#eaf1ff;color:#2459b8}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.muted{color:var(--muted)}.mobile{display:none}.hidden{display:none!important}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%}.request-line{display:grid;grid-template-columns:1fr 100px auto;gap:8px;margin:8px 0}.bottom{display:none}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.side{width:190px}.main{margin-left:190px}}
@media(max-width:700px){body{padding-bottom:72px}.side{display:none}.main{margin-left:0}.top{height:58px;padding:0 14px}.page{padding:14px}.stats{gap:9px}.card{padding:13px}.stat strong{font-size:20px}.form{grid-template-columns:1fr}.request-line{grid-template-columns:1fr 80px}.request-line button{grid-column:1/-1}.bottom{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.bottom button{border:0;background:#fff;color:var(--muted);font-size:9px}.bottom button.active{color:var(--accent);font-weight:800}.input{min-width:0;flex:1}}
</style></head><body><aside class="side"><div class="brand">NukuStock<small>Nukutepipi · Démo autonome</small></div><div class="nav" id="desktopNav"></div></aside><main class="main"><header class="top"><strong>NukuStock</strong><span class="muted">Stock & Approvisionnements</span></header><div id="content"></div></main><nav class="bottom" id="bottomNav"></nav><script>
const products=[{id:1,ref:'BOI-0001',name:'Coca-Cola 33 cl',type:'Acheté',price:145,min:80,lots:[['A-2602','21/02/2027','Container',30],['B-2608','30/08/2027','Container',100],['C-2609','07/09/2027','Restaurant',20]]},{id:2,ref:'EAU-0003',name:'Perrier 75 cl',type:'Acheté',price:310,min:48,lots:[['P-774','30/04/2027','Container',72]]},{id:3,ref:'MAI-0001',name:'Citronnade Mr Guy',type:'Fabriqué',price:420,min:12,lots:[['CMG-0806','12/08/2026','Cave à jus',18]]}];
let requests=JSON.parse(localStorage.getItem('nuku_demo_requests')||'null')||[{id:'REQ-0125',service:'Room Service',status:'Préparation',items:[['Coca-Cola 33 cl',48],['Perrier 75 cl',24]]},{id:'REQ-0124',service:'Audio',status:'Envoyée',items:[['Coca-Cola 33 cl',12]]}];
const pages=[['dashboard','Dashboard'],['products','Produits'],['stocks','Stocks'],['requests','Demandes'],['orders','Commandes'],['transfers','Transferts'],['inventory','Inventaires'],['suppliers','Fournisseurs'],['reports','Rapports'],['settings','Réglages']];let current='dashboard';
function total(p){return p.lots.reduce((s,l)=>s+l[3],0)}function money(n){return Math.round(n).toLocaleString('fr-FR')+' XPF'}function badge(t,c=''){return `<span class="badge ${c}">${t}</span>`}
function shell(title,sub,body,action=''){return `<section class="page"><div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>${body}</section>`}
function dashboard(){let val=products.reduce((s,p)=>s+total(p)*p.price,0),qty=products.reduce((s,p)=>s+total(p),0),low=products.filter(p=>total(p)<p.min).length;return shell('Tableau de bord','Vue d’ensemble des stocks et opérations',`<div class="stats"><div class="card stat"><span>Valeur du stock</span><strong>${money(val)}</strong></div><div class="card stat"><span>Unités en stock</span><strong>${qty}</strong></div><div class="card stat"><span>Sous minimum</span><strong>${low}</strong></div><div class="card stat"><span>Demandes en cours</span><strong>${requests.length}</strong></div></div><div class="grid2"><div class="card"><strong>Demandes récentes</strong>${requests.map(r=>`<div class="row"><div><b>${r.id}</b><div class="muted">${r.service}</div></div>${badge(r.status,r.status==='Préparation'?'info':'warn')}</div>`).join('')}</div><div class="card"><strong>Alertes DLUO / DLC</strong><div class="row"><div><b>Citronnade Mr Guy</b><div class="muted">Lot CMG-0806 · Cave à jus</div></div>${badge('12/08/2026','warn')}</div></div></div>`)}
function productPage(){return shell('Produits','Mercuriel central, lots et DLUO/DLC',`<div class="card"><div class="toolbar"><input class="input" placeholder="Rechercher un produit..."><button class="btn">+ Ajouter</button></div><div class="table"><table><tr><th>Réf.</th><th>Produit</th><th>Type</th><th>Stock</th><th>Lots</th><th>Minimum</th><th>Prix</th></tr>${products.map(p=>`<tr><td>${p.ref}</td><td><b>${p.name}</b></td><td>${badge(p.type,p.type==='Fabriqué'?'info':'')}</td><td>${badge(total(p),total(p)<p.min?'danger':'good')}</td><td>${p.lots.length}</td><td>${p.min}</td><td>${money(p.price)}</td></tr>`).join('')}</table></div></div>`)}
function stocks(){let rows=products.flatMap(p=>p.lots.map(l=>[p,...l]));return shell('Stocks','Stock par lieu, produit, lot et DLUO/DLC',`<div class="card"><div class="table"><table><tr><th>Lieu</th><th>Produit</th><th>Lot</th><th>DLUO/DLC</th><th>Quantité</th><th>Valeur</th></tr>${rows.map(([p,lot,date,loc,q])=>`<tr><td><b>${loc}</b></td><td>${p.name}</td><td>${lot}</td><td>${badge(date,'warn')}</td><td>${q}</td><td>${money(q*p.price)}</td></tr>`).join('')}</table></div></div>`)}
function requestPage(){return shell('Demandes d’approvisionnement','Demandes multi-produits des services internes',`<div class="card"><div class="form"><div class="field"><label>Service</label><select id="svc"><option>Room Service</option><option>Cuisine</option><option>Activités</option><option>Audio</option><option>Housekeeping</option></select></div></div><h3>Produits</h3><div id="reqLines"></div><button class="btn alt" onclick="addLine()">+ Ajouter un produit</button><button class="btn" style="margin-left:8px" onclick="saveRequest()">Envoyer</button></div>${requests.map(r=>`<div class="card"><div class="row"><div><b>${r.id} · ${r.service}</b></div>${badge(r.status,r.status==='Préparation'?'info':'warn')}</div>${r.items.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`).join('')}`)}
function addLine(){let d=document.getElementById('reqLines');if(!d)return;let x=document.createElement('div');x.className='request-line';x.innerHTML=`<select>${products.map(p=>`<option>${p.name}</option>`).join('')}</select><input type="number" min="1" value="1"><button class="btn alt" onclick="this.parentElement.remove()">Retirer</button>`;d.appendChild(x)}
function saveRequest(){let lines=[...document.querySelectorAll('#reqLines .request-line')];if(!lines.length)return;let items=lines.map(x=>[x.querySelector('select').value,Number(x.querySelector('input').value)]);requests.unshift({id:'REQ-'+String(126+requests.length).padStart(4,'0'),service:document.getElementById('svc').value,status:'Envoyée',items});localStorage.setItem('nuku_demo_requests',JSON.stringify(requests));render();setTimeout(addLine,0)}
function generic(name,sub){let bodies={orders:'Cycle fournisseur : Demande → Commande → Connaissement → Réception → Stock.',transfers:'Les transferts déplaceront le stock entre deux lieux tout en conservant le lot, la quantité, la date et l’utilisateur.',inventory:'Inventaire début/fin d’exploitation, journalier, hebdomadaire ou mensuel avec stock théorique, réel, écart et valorisation.',suppliers:'Coordonnées, conditions de paiement, catalogue et historique de commandes.',reports:'Rapports par produit, catégorie, fournisseur, lieu, service et période. Exports Excel/PDF prévus.',settings:'Gestion des rôles : Administrateur, Responsable Stock, Responsable Service, Lecture seule.'};return shell(name,sub,`<div class="card"><p>${bodies[current]}</p><div class="row"><span>Module</span>${badge('Structure V1 prête','good')}</div><div class="row"><span>Responsive téléphone / tablette / PC</span>${badge('Oui','good')}</div><div class="row"><span>Connexion Supabase</span>${badge('À brancher','warn')}</div></div>`)}
function render(){document.querySelectorAll('.nav button,.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));let html=current==='dashboard'?dashboard():current==='products'?productPage():current==='stocks'?stocks():current==='requests'?requestPage():generic(pages.find(x=>x[0]===current)[1],'Module NukuStock');document.getElementById('content').innerHTML=html;if(current==='requests')setTimeout(addLine,0)}
function go(p){current=p;render()}document.getElementById('desktopNav').innerHTML=pages.map(p=>`<button data-page="${p[0]}" onclick="go('${p[0]}')">${p[1]}</button>`).join('');document.getElementById('bottomNav').innerHTML=pages.slice(0,5).map(p=>`<button data-page="${p[0]}" onclick="go('${p[0]}')">${p[1]}</button>`).join('');render();
</script></body></html>
